    ports: ["${SQUADS_DIAGNOSTICS_PORT:-127.0.0.1:18272}:7622"]
    volumes: [squads-data:/data]
    networks: [kelvara-backend, kelvara-egress]
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    healthcheck: {test: [CMD, node, -e, "fetch('http://127.0.0.1:7622/health/live').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"], interval: 10s, timeout: 3s, retries: 5}
  status-page:
    build: {context: ., dockerfile: services/status-page/Dockerfile}
    environment:
      HOST: 0.0.0.0
      PORT: 8090
      STATUS_DATABASE_PATH: /data/status.sqlite
      PROBE_INTERVAL_MS: 60000
    ports: ["${STATUS_PAGE_PORT:-127.0.0.1:18090}:8090"]
    volumes: [status-data:/data]
    networks: [kelvara-backend, local-admin]
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    healthcheck: {test: [CMD, node, -e, "fetch('http://127.0.0.1:8090/healthz').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"], interval: 10s, timeout: 3s, retries: 5}
  cloudflare-cutover-gate:
    build: {context: ., dockerfile: services/cloudflare-gate/Dockerfile}
    profiles: [cloudflared]
    environment:
      KELVARA_RELEASE_SHA: ${KELVARA_RELEASE_SHA:?set immutable production Git commit}
    volumes:
      - ./production/approvals:/run/kelvara:ro
    depends_on:
      program-backend: {condition: service_healthy}
      control-center: {condition: service_healthy}
      observation-hub: {condition: service_healthy}
      indexer-squads: {condition: service_healthy}
      status-page: {condition: service_healthy}
    networks: [kelvara-backend]
    restart: "no"
  cloudflared:
    image: "cloudflare/cloudflared:2025.9.1"
    profiles: [cloudflared]
    command: tunnel --no-autoupdate --config /etc/cloudflared/config.yml run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARED_TUNNEL_TOKEN:?required}
    volumes:
      - ./cloudflared/config.yml:/etc/cloudflared/config.yml:ro
    depends_on:
      cloudflare-cutover-gate: {condition: service_completed_successfully}
    networks: [kelvara-egress, kelvara-backend]
    restart: unless-stopped
networks:
  kelvara-backend:
    internal: true
  kelvara-egress:
  # Local-admin permits loopback-published ports; backend remains internal.
  local-admin:
volumes:
  program-runtime:
  control-center-data:
  observation-hub-data:
  squads-data:
  status-data:
